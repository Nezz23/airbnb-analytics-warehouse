[project]
name = "airbnb-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
snowflake = [
    "dbt-snowflake>=1.12.5",
    "snowflake-connector-python>=5.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "tests", "queries"]
