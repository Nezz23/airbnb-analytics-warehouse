# Project-local profiles: run dbt with --profiles-dir transform (never touches ~/.dbt).
airbnb:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('AIRBNB_DATA_DIR', '../data') }}/warehouse.duckdb"
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('AIRBNB_DATA_DIR') }}/warehouse.duckdb"
      threads: 2
    # Not yet exercised against a live account: `uv sync --extra snowflake`, then see docs/snowflake.md.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'AIRBNB_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AIRBNB') }}"
      schema: analytics
      threads: 4
      query_tag: airbnb_dbt                   # attribute credits to this project in QUERY_HISTORY
      client_session_keep_alive: false        # never hold a session (or the warehouse) open
      connect_retries: 2
