version: 2

models:
  - name: stg_bronze_manifest
    description: Ingestion manifest - one row per raw file with its data-contract outcome.
    columns:
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [accepted, quarantined]}}
      - name: dataset
        data_tests:
          - accepted_values: {arguments: {values: [listings, calendar, reviews]}}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [dataset, snapshot_date]}

  - name: stg_listings
    description: Typed listing attributes and measures, one row per listing per accepted snapshot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [listing_id, snapshot_date]}
    columns:
      - name: listing_id
        data_tests: [not_null]
      - name: snapshot_date
        description: Snapshot the row came from; only snapshots the contract accepted.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_bronze_manifest'), field: snapshot_date}
      - name: host_id
        data_tests: [not_null]
      - name: borough
        data_tests:
          - accepted_values: {arguments: {values: [Manhattan, Brooklyn, Queens, Bronx, Staten Island]}}
      - name: price_usd
        description: Advertised nightly price. Null when the listing shows no price (about a third of listings).
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, inclusive: false}}
      - name: quote_nights
        description: Length of the stay the price was quoted for (mostly 30; sometimes 1-3).
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 1, max_value: 400}}
      - name: minimum_nights
        description: A few rows per snapshot arrive null upstream; tolerated, so this only warns.
        data_tests:
          - not_null: {config: {severity: warn}}
          - dbt_utils.accepted_range: {arguments: {min_value: 1}}
      - name: latitude
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 40.4, max_value: 41.0}}
      - name: longitude
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: -74.3, max_value: -73.6}}
      - name: availability_365
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 365}}
      - name: ll18_status
        description: Local Law 18 status signal; see macros/compliance.sql.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [registered, exempt, long_term_30_plus, unregistered_short_term, unknown]}

  - name: stg_calendar_monthly
    description: Forward availability, one row per listing x snapshot x stay month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [listing_id, snapshot_date, stay_month]}
      - dbt_utils.expression_is_true:
          arguments: {expression: "available_nights between 0 and calendar_nights"}
    columns:
      - name: calendar_nights
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 1, max_value: 31}}

  - name: stg_reviews
    description: Deduplicated review log (review id, listing, date). No reviewer names or text.
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: listing_id
        data_tests: [not_null]

unit_tests:
  - name: stg_listings_types_and_classifies_ll18
    description: Money parsing, license normalisation, LL18 status, and that quarantined snapshots never load.
    model: stg_listings
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_manifest')
        rows:
          - {dataset: listings, snapshot_date: 2026-01-01, status: accepted}
          - {dataset: listings, snapshot_date: 2026-01-08, status: quarantined}
      - input: source('bronze', 'listings')
        rows:
          - {id: "1", snapshot_date: 2026-01-01, host_id: "9", price: "$1,250.00", minimum_nights: "2", license: "Ose-strreg-0001075", instant_bookable: "t"}
          - {id: "2", snapshot_date: 2026-01-01, host_id: "9", price: "$80.00", minimum_nights: "1", license: "Exempt", instant_bookable: "f"}
          - {id: "3", snapshot_date: 2026-01-01, host_id: "9", price: "", minimum_nights: "30", license: "", instant_bookable: "f"}
          - {id: "4", snapshot_date: 2026-01-01, host_id: "9", price: "$99.00", minimum_nights: "3", license: null, instant_bookable: "f"}
          - {id: "5", snapshot_date: 2026-01-01, host_id: "9", price: "$99.00", minimum_nights: null, license: null, instant_bookable: "f"}
          - {id: "6", snapshot_date: 2026-01-08, host_id: "9", price: "$99.00", minimum_nights: "3", license: null, instant_bookable: "f"}
    expect:
      rows:
        - {listing_id: 1, price_usd: 1250.0, license: "OSE-STRREG-0001075", ll18_status: registered, instant_bookable: true}
        - {listing_id: 2, price_usd: 80.0, license: "EXEMPT", ll18_status: exempt, instant_bookable: false}
        - {listing_id: 3, price_usd: null, license: null, ll18_status: long_term_30_plus, instant_bookable: false}
        - {listing_id: 4, price_usd: 99.0, license: null, ll18_status: unregistered_short_term, instant_bookable: false}
        - {listing_id: 5, price_usd: 99.0, license: null, ll18_status: unknown, instant_bookable: false}
